name: Build HMI releases

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: HMI version without the v prefix
        required: true
        type: string

permissions:
  contents: read

jobs:
  hmi:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x86_64
            script: ./deploy/scripts/build_hmi_linux_release.sh
            artifact: inspection-hmi-*-linux-x86_64.tar.zst
          - os: windows-2022
            name: win64
            script: .\deploy\scripts\build_hmi_windows_release.ps1
            artifact: inspection-hmi-*-win64.zip
          - os: macos-13
            name: macos-x86_64
            script: ./deploy/scripts/build_hmi_macos_release.sh
            artifact: inspection-hmi-*-macos-x86_64.tar.zst
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.4.2'
          # Keep downloaded Qt outside GITHUB_WORKSPACE: the release scripts
          # deliberately reject untracked files before packaging.
          dir: ${{ runner.temp }}/qt
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == push ]]; then echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; else echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"; fi
      - name: Build HMI (Linux or macOS)
        if: matrix.os != 'windows-2022'
        shell: bash
        run: |
          ${{ matrix.script }} --version "${{ steps.version.outputs.value }}"
      - name: Build HMI (Windows)
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: .\deploy\scripts\build_hmi_windows_release.ps1 -Version "${{ steps.version.outputs.value }}"
      - uses: actions/upload-artifact@v4
        with:
          name: inspection-hmi-${{ steps.version.outputs.value }}-${{ matrix.name }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 30
