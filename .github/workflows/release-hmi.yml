name: Build HMI releases

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: HMI version without the v prefix
        required: true
        type: string

permissions:
  contents: read

jobs:
  hmi:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x86_64
            script: ./deploy/scripts/build_hmi_linux_release.sh
            artifact: inspection-hmi-*-linux-x86_64.tar.zst
          - os: windows-2022
            name: win64
            script: .\deploy\scripts\build_hmi_windows_release.ps1
            artifact: inspection-hmi-*-win64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up MSVC
        if: matrix.os == 'windows-2022'
        uses: ilammy/msvc-dev-cmd@v1
      # Build the Linux bundle against Ubuntu 24.04's Qt. The downloadable Qt
      # 6.4 binary is linked to an obsolete ICU ABI that the runner cannot
      # bundle or validate for the target PC.
      - name: Install Qt on Linux
        if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-svg-dev
      - name: Install Qt on Windows
        if: matrix.os == 'windows-2022'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.4.2'
          # Keep downloaded Qt outside GITHUB_WORKSPACE: the release scripts
          # deliberately reject untracked files before packaging.
          dir: ${{ runner.temp }}/qt
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == push ]]; then echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"; else echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"; fi
      - name: Build HMI (Linux or macOS)
        if: matrix.os != 'windows-2022'
        shell: bash
        run: |
          ${{ matrix.script }} --version "${{ steps.version.outputs.value }}"
      - name: Build HMI (Windows)
        if: matrix.os == 'windows-2022'
        shell: pwsh
        run: .\deploy\scripts\build_hmi_windows_release.ps1 -Version "${{ steps.version.outputs.value }}"
      - uses: actions/upload-artifact@v4
        with:
          name: inspection-hmi-${{ steps.version.outputs.value }}-${{ matrix.name }}
          path: dist/${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 30
