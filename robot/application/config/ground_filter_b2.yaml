ground_filter:
  ros__parameters:
    # Obstacle band above the locally measured ground. The lower bound clears B2's
    # own gait bob and small ground clutter; the upper bound is set above the
    # robot's 0.7 m standing height so overhead structure is still mapped.
    min_height_above_ground: 0.15
    max_height_above_ground: 1.50

    ground_cell_size: 0.35
    ground_search_radius: 1.00
