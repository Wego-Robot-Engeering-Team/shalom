# 브릿지 노드 파라미터.
#
# 안전에 직결되는 값은 여기서 임의로 늘리지 말 것. 관제 화면의 설정 창은
# 이 값들을 읽기 전용으로 표시하며, 변경 가능한 것처럼 보이게 두지 않는다.

/hmi_bridge:
  ros__parameters:
    # 관제 제어 포트. 포트를 최소로 유지하는 것은 외부 통신 차단 검증
    # (패킷 캡처)을 단순하게 만들기 위한 설계다.
    port: 9090

    map_frame: "map"
    base_frame: "base_link"
    # 지도와 지도별 점검 지점은 로봇이 소유한다. HMI는 이 경로를 직접
    # 읽지 않고 브릿지의 지도 목록 API만 사용한다.
    maps_dir: "/var/lib/shalom/maps"

    # 관제 하트비트가 이 시간 이상 없으면 생존 신호 발행을 멈춘다.
    # 실제 정지는 같은 1초 계약에 따라 안전 노드가 최종 판단한다.
    heartbeat_timeout_ms: 1000

    # D455 프레임은 촬영 요청을 처리하는 데만 쓴다. HMI로 연속 영상을 보내지 않는다.
    # 토픽명은 realsense_d455/d455_capture.launch.py의 remap 계약과 같아야 한다.
    capture.enabled: true
    capture.color_topic: "/fr3/camera_2d/image_raw"
    capture.depth_topic: "/fr3/camera_3d/image_raw"  # aligned 16UC1 depth image

    # ------------------------------------------------------------------
    # 감시할 센서.
    #
    # 관제 화면의 "센서 상태" 는 이 목록을 그대로 그린다. 관제는 어떤 센서가
    # 있어야 하는지 모르고, 판정도 하지 않는다 (프로토콜 §9.2). 그래서 이
    # 목록이 곧 "이 로봇에 있어야 할 센서" 다.
    #
    # 아직 붙지 않은 것도 적어 둔다. 줄이 없으면 조작자는 그 센서가 원래 없는
    # 것인지 죽은 것인지 알 수 없고, 없는 편이 정상처럼 보인다. 적어 두면
    # "신호 없음" 으로 뜬다.
    #
    # 브릿지는 내용을 읽지 않고 도착 시각만 센다 (제네릭 구독). 그래서 새
    # 센서를 붙일 때 이 파일만 고치면 되고 노드는 그대로다.
    sensors: ["lidar", "imu", "joints_b2", "joints_fr3", "cam_arm_2d", "cam_arm_3d"]

    sensor:
      lidar:
        name: "LiDAR"
        topic: "/b2/points"
        type: "sensor_msgs/msg/PointCloud2"
        expected_hz: 10.0
      imu:
        name: "IMU"
        topic: "/b2/imu"
        type: "sensor_msgs/msg/Imu"
        expected_hz: 200.0
      joints_b2:
        # 시뮬레이터의 state_rate_hz 와 같아야 한다. 실기에서는 b2_state_bridge
        # 가 LowState 를 그대로 중계하므로 SDK 주기(500 Hz)를 따르며, 그때
        # 이 값도 함께 고쳐야 한다 — 200 인 채로 두면 화면이 "주기 저하" 로
        # 뜬다.
        name: "B2 관절"
        topic: "/b2/joint_states"
        type: "sensor_msgs/msg/JointState"
        expected_hz: 200.0
      joints_fr3:
        name: "FR3 관절"
        topic: "/fr3/joint_states"
        type: "sensor_msgs/msg/JointState"
        expected_hz: 100.0
      cam_arm_2d:
        name: "D455 컬러"
        topic: "/fr3/camera_2d/image_raw"
        type: "sensor_msgs/msg/Image"
        expected_hz: 15.0
      cam_arm_3d:
        name: "D455 깊이 점군"
        topic: "/fr3/camera_3d/points"
        type: "sensor_msgs/msg/PointCloud2"
        expected_hz: 10.0
