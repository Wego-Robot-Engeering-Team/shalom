# AMCL for B2, used only when the robot localises in a saved map
# (`b2_navigation.launch.py map:=<file.yaml>`). While mapping, slam_toolbox owns
# map -> odom and this node is not started at all.
#
# The scan it works from is the same one slam_toolbox used to build the map:
# /obstacle_scan, produced by flattening the ground-segmented 3D cloud. Feeding
# AMCL the raw LiDAR instead would match against returns from the floor and the
# robot's own legs, which are not in the map.
amcl:
  ros__parameters:
    scan_topic: /obstacle_scan
    base_frame_id: "base_link"
    odom_frame_id: "odom"
    global_frame_id: "map"

    # Odometry comes from KISS-ICP on the 3D cloud, not wheel encoders, and is
    # good. These are the noise AMCL should expect from it, not from a skidding
    # tracked base - hence values well below the nav2 defaults.
    robot_model_type: "nav2_amcl::OmniMotionModel"
    alpha1: 0.1    # rotation noise from rotation
    alpha2: 0.1    # rotation noise from translation
    alpha3: 0.1    # translation noise from translation
    alpha4: 0.1    # translation noise from rotation
    alpha5: 0.1    # strafe noise, Omni model only

    # A quadruped can strafe and the velocity policy is trained for it, so the
    # omni model is the honest one. The differential model would attribute a
    # sideways step to a rotation that never happened.

    max_particles: 3000
    min_particles: 800
    update_min_d: 0.15   # m before a filter update; B2 walks, so this is ~2 strides
    update_min_a: 0.15   # rad
    resample_interval: 1
    transform_tolerance: 1.0   # matches the costmaps; slam-side lag bites here too

    laser_model_type: "likelihood_field"
    laser_max_range: 30.0
    laser_min_range: 0.4
    max_beams: 120
    sigma_hit: 0.2
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0

    # Do not publish map -> odom if the filter has not converged; a confident
    # wrong transform is worse than none, because Nav2 will plan against it.
    tf_broadcast: true
    set_initial_pose: true
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0
