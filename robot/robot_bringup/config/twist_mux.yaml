twist_mux:
  ros__parameters:
    # The current HMI, Nav2 output, and safety gate use geometry_msgs/Twist.
    # twist_mux 4.5 defaults to TwistStamped, so keep the wire type explicit.
    use_stamped: false

    # A source must continuously renew its 300 ms lease. Higher numeric values
    # win; equal priorities are intentionally avoided. Autonomous producers are
    # admitted by base_source_manager first: the mux must never fall back from
    # one autonomous source to another merely because a command times out.
    topics:
      teleop:
        topic: /motion/teleop/cmd_vel
        timeout: 0.3
        priority: 100
      manual_hold:
        topic: /motion/manual_hold/cmd_vel
        timeout: 0.3
        priority: 90
      autonomy:
        topic: /motion/autonomy/cmd_vel
        timeout: 0.3
        priority: 80
    # A missing lock heartbeat is locked (fail-closed). Priority 90 blocks
    # autonomous sources below it while leaving teleop (100) available once
    # safety_gate releases its transition inhibit.
    locks:
      manual_autonomy:
        topic: /motion/manual_autonomy_lock
        timeout: 0.3
        priority: 90
