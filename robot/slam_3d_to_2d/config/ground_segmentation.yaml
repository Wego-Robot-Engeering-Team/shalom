# Default GSeg3D parameters.  Robot-specific values -- above all `robot_frame`
# and `lidar_to_ground` -- belong in the caller's own params file, passed as
# `gseg_params_file:=`.  See shalom/config/gseg3d_b2.yaml for a worked example.
ground_segmentation:
  ros__parameters:
    robot_frame: "base_link"

    # Processing bounds relative to the robot.
    maxX:  50.0
    minX: -50.0
    maxY:  50.0
    minY: -50.0
    maxZ:  50.0
    minZ: -50.0

    downsample: false
    downsample_resolution: 0.1

    # Negative = LiDAR sits above the ground.  Must match the actual mount.
    lidar_to_ground: -0.74

    transform_tolerance: 0.5

    # Ground modelling cells.  Smaller X/Y = more detail, noisier fit.
    cellSizeX: 1.0
    cellSizeY: 1.0
    cellSizeZ: 4.0          # vertical bin, phase 1
    cellSizeZPhase2: 1.0    # ground layer thickness, phase 2

    # Surfaces steeper than this are obstacles, not ground.
    slopeThresholdDegrees: 30.0

    # Distance from the fitted ground plane that still counts as ground.
    # Keep below cellSizeZPhase2.
    groundInlierThreshold: 0.2

    centroidSearchRadius: 5.0
    maxGroundHeightDeviation: 0.2

    use_imu_orientation: false
    show_benchmark: false
