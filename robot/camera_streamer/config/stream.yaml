# camera_streamer 뷰파인더 송신 설정.
#
# 이 경로는 화질이 아니라 지연으로 평가한다. 실제 점검 사진은 정지 상태에서
# 원본으로 찍어 NAS 로 보내므로(과업지시서 2.2.4), 여기서 화질을 아껴 지연을
# 얻는 편이 옳다 — 화면이 밀리면 조작자가 팔을 더 움직이게 된다.
/**:
  ros__parameters:
    # 젯슨의 NVENC. 개발 PC 에는 없으므로 런치에서 x264enc 로 바꿔 검증한다.
    #
    # x264enc 는 libx264(GPL-2+) 를 링크한다. 검증에만 쓰고 납품 파이프라인에는
    # 넣지 말 것 — "NVENC 가 없으면 x264 로" 같은 폴백이 들어가는 순간 로봇
    # 소프트웨어 전체가 GPL 이 된다.
    encoder: "nvv4l2h264enc"

    # 0.0.0.0 으로 두면 모든 인터페이스에서 듣는다. 과업지시서 7.1 이 외부
    # 통신 차단을 패킷 캡처로 검증하라고 하므로 내부망 주소를 명시한다.
    # 배포 시 로봇의 실제 내부망 주소로 바꾼다.
    bind_address: "127.0.0.1"
    port: 8554
    mount_point: "/arm-rgb"

    # 기본: 720p 15 fps 4 Mbps.
    # 링크가 빠듯하면 848x480 30 fps 3 Mbps 가 조작감이 낫다 — 뷰파인더에서는
    # 화질보다 지연이다.
    bitrate_kbps: 4000
    max_fps: 15.0
    keyframe_interval: 15      # 1 초. 중간에 붙어도 곧 그림이 뜬다.

    image_topic: "color/image_raw"
