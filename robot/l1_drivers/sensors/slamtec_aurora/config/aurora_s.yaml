# SLAMTEC Aurora S 원본 odom 출력.
#
# 이 드라이버는 Aurora 장착점의 6DoF pose를 낸다. 기존 KISS-ICP가 소유하는
# odom -> base_link와 절대로 같은 프레임을 쓰지 않는다. 장착 외부파라미터를
# 실측·검증한 뒤에만 별도 어댑터로 표준 odom -> base_link에 승격한다.
/aurora_driver:
  ros__parameters:
    ip_address: "192.168.11.1"
    reconn_wait_ms: 3000

    # 원시 Aurora 좌표계: 기존 내비게이션 TF와 충돌하지 않게 분리한다.
    map_frame: "aurora_map"
    odom_frame: "aurora_odom"
    robot_frame: "aurora_link"
    laser_frame: "aurora_laser"
    imu_frame: "aurora_imu_link"
    camera_left: "aurora_camera_left"
    camera_right: "aurora_camera_right"

    odom_topic: "/aurora/odom"
    robot_pose_topic: "/aurora/pose"
    system_status_topic_name: "/aurora/system_status"

    # odom 검증 단계에서는 대역폭 큰 지도·카메라·점군을 받지 않는다.
    # 0은 해당 worker 비활성화다.
    odometry_pub_period: 0.05
    robot_pose_pub_period: 0.05
    scan_pub_period: 0.0
    map_update_period: 0.0
    map_pub_period: 0.0
    stereo_image_pub_period: 0.0
    point_cloud_pub_period: 0.0
    raw_image_on: false
    no_preview_image: true

# 전용 사람 분할 + 깊이 점군 테스트. Aurora SDK에 별도 세션으로 연결한다.
/aurora_person_cloud:
  ros__parameters:
    ip_address: "192.168.11.1"
    person_label_id: 1           # 현재 Aurora coco80 모델의 person 라벨
    min_depth_m: 0.2
    max_depth_m: 10.0
    max_planar_range_m: 3.0    # 카메라 기준 전방·좌우 평면 거리(m)
    mask_erosion_pixels: 2    # 깊이 영상 기준 가장자리 2픽셀 제외, 0이면 해제
    max_local_depth_jump_m: 0.25 # 5x5 주변보다 뒤로 튀는 깊이 허용치(m), 0이면 해제
    pixel_stride: 1              # 1이면 사람의 유효 깊이 픽셀 전체 사용
    min_person_points: 1         # 한 프레임의 최소 유효 포인트 수
    sync_tolerance_ms: 100       # semantic/depth 장치 타임스탬프 허용 차이
    max_publish_rate_hz: 10.0
    reconnect_wait_ms: 3000
    frame_id: "aurora_depth_local"
    points3d_topic: "/aurora/person/points3d"
    points2d_topic: "/aurora/person/points2d"
    camera_image_topic: "/aurora/person/camera_image"
    overlay_image_topic: "/aurora/person/overlay_image"
