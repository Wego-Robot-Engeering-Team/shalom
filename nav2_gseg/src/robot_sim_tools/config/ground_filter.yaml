ground_filter:
  ros__parameters:
    # Obstacles are accepted only in this band above the nearby, locally
    # measured ground. Hill elevation itself therefore does not affect the
    # filter, while high foliage and tree canopies are discarded.
    min_height_above_ground: 0.15
    max_height_above_ground: 1.20

    # Ground elevation is estimated in local XY cells. Searching a short
    # distance across adjacent cells keeps the result stable on slopes and
    # when a LiDAR ray has no direct ground return beneath an obstacle.
    ground_cell_size: 0.35
    ground_search_radius: 1.00
