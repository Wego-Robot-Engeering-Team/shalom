[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-sdk"
version = "0.3.0"
description = "Customer Python API for the robot bridge protocol"
requires-python = ">=3.9"
license = {text = "Proprietary"}
authors = [{name = "Wego Robotics"}]

[tool.setuptools.packages.find]
include = ["robot_sdk*"]
