# 브릿지 노드 파라미터.
#
# 안전에 직결되는 값은 여기서 임의로 늘리지 말 것. 관제 화면의 설정 창은
# 이 값들을 읽기 전용으로 표시하며, 변경 가능한 것처럼 보이게 두지 않는다.

/shalom_bridge:
  ros__parameters:
    # 관제 제어 포트. 포트를 최소로 유지하는 것은 외부 통신 차단 검증
    # (패킷 캡처)을 단순하게 만들기 위한 설계다.
    port: 9090

    map_frame: "map"
    base_frame: "base_link"

    # 조작 명령이 이 시간 이상 끊기면 속도를 0 으로 래치한다.
    # 관제가 멈추거나 링크가 끊겨도 로봇이 계속 달리지 않게 하는 값이다.
    # 프로토콜 문서(§3.1)에 명시된 값과 반드시 같아야 한다.
    deadman_ms: 300

    # 관제 하트비트가 이 시간 이상 없으면 생존 신호 발행을 멈춘다.
    # 실제 정지(3초)는 안전 노드가 별도로 판단한다.
    heartbeat_timeout_ms: 1000
